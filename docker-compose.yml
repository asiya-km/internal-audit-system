services:
  # ---- PostgreSQL ----
  # Port bound to 127.0.0.1 so it is reachable for local development
  # but NOT exposed to external networks in production.
  postgres:
    image: postgres:16-alpine
    container_name: iams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iams}
      POSTGRES_DB: ${POSTGRES_DB:-iams}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - iams_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iams} -d ${POSTGRES_DB:-iams}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iams-net

  # ---- API (production container) ----
  # SESSION_SECRET has NO fallback — the application will refuse to
  # start in production without a strong secret.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: iams-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-iams}:${POSTGRES_PASSWORD:-iams}@postgres:5432/${POSTGRES_DB:-iams}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required for production}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    networks:
      - iams-net

  # ---- Web (nginx-served SPA) ----
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: iams-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - iams-net

networks:
  iams-net:
    driver: bridge

volumes:
  iams_pgdata: